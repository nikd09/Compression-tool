<meta charset="utf-8">
<title>Materials</title>
<style>
:root{--bg:#f9f9f7;--fg:#0b0b0b;--muted:#5b6673;--line:#e1e0d9;--card:#ffffff;
--accent:#d6006e;--shadow:0 1px 3px rgba(0,0,0,.06);}
@media (prefers-color-scheme:dark){:root{--bg:#0d0d0d;--fg:#ffffff;--muted:#9aa5b1;
--line:#2c2c2a;--card:#1a1a19;--accent:#e0227e;--shadow:0 1px 3px rgba(0,0,0,.4);}}
*{box-sizing:border-box}
body{margin:0;padding:2.2rem 1.5rem 4rem;background:var(--bg);color:var(--fg);
font:15px/1.55 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;}
.wrap{max-width:1200px;margin:0 auto}
h1{font-size:1.75rem;font-weight:670;letter-spacing:-.018em;margin:0 0 .2rem}
.sub{color:var(--muted);margin:0 0 2.2rem;font-size:.92rem}
.empty{padding:3rem 1rem;text-align:center;color:var(--muted);border:1px dashed var(--line);
border-radius:10px;}

.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:1rem;}
.card{background:var(--card);border:1px solid var(--line);border-radius:12px;
padding:1rem 1.1rem;box-shadow:var(--shadow);transition:box-shadow .15s ease,transform .15s ease;}
.card:hover{box-shadow:0 4px 14px rgba(0,0,0,.1);transform:translateY(-1px);}
.card-head{display:flex;align-items:baseline;justify-content:space-between;gap:.6rem;
margin-bottom:.8rem;}
.card-head a{color:var(--fg);text-decoration:none;font-size:1.02rem;font-weight:650;
letter-spacing:-.012em;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
.card-head a:hover{color:var(--accent);}
.added{flex:none;font-size:.7rem;color:var(--muted);white-space:nowrap;}
.stats{display:grid;grid-template-columns:1fr 1fr;gap:.55rem .5rem;}
.stat b{display:block;font-size:1.05rem;font-variant-numeric:tabular-nums;font-weight:650;}
.stat span{display:block;font-size:.66rem;text-transform:uppercase;letter-spacing:.05em;
color:var(--muted);margin-top:.1rem;}
footer{margin-top:2.5rem;color:var(--muted);font-size:.78rem;border-top:1px solid var(--line);
padding-top:1rem;}
</style>

<div class="wrap">
  <h1>Materials</h1>
  <p class="sub" id="sub"></p>
  <div id="content"></div>
  <footer>Rendered from the indexed records. Regenerated automatically on every
    ingest, so if this looks stale, it will refresh itself the next time anyone
    commits a test. Open a material's own report for its full charts.</footer>
</div>

<script>
const DATA = /*__DATA__*/;

function esc(s){return String(s).replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));}
function fmtDate(iso){
  if(!iso) return "-";
  const d = new Date(iso);
  return isNaN(d) ? iso.slice(0,10) : d.toISOString().slice(0,10);
}

const materials = DATA.materials || [];
document.getElementById("sub").textContent =
  materials.length + " material" + (materials.length===1?"":"s") + " indexed";

const content = document.getElementById("content");
if(!materials.length){
  content.innerHTML = '<div class="empty">Nothing ingested into this workspace yet.</div>';
} else {
  const cards = materials.map(m => `
    <div class="card">
      <div class="card-head">
        <a href="${esc(m.slug)}.html">${esc(m.material)}</a>
        <span class="added">Added ${fmtDate(m.dateAdded)}</span>
      </div>
      <div class="stats">
        <div class="stat"><b>${m.specimens}</b><span>Specimens</span></div>
        <div class="stat"><b>${m.runs}</b><span>Runs</span></div>
        <div class="stat"><b>${m.meanPeak != null ? m.meanPeak.toFixed(1) + " MPa" : "-"}</b><span>Peak stress</span></div>
        <div class="stat"><b>${m.meanH0 != null ? m.meanH0.toFixed(3) + " mm" : "-"}</b><span>Thickness (h0)</span></div>
      </div>
    </div>`).join("");

  content.innerHTML = `<div class="grid">${cards}</div>`;
}
</script>
