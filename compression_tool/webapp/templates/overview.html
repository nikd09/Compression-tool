<meta charset="utf-8">
<title>Materials Overview</title>
<style>
:root{--bg:#f9f9f7;--fg:#0b0b0b;--muted:#5b6673;--line:#e1e0d9;--card:#ffffff;
--accent:#2a78d6;--shadow:0 1px 3px rgba(0,0,0,.06);}
@media (prefers-color-scheme:dark){:root{--bg:#0d0d0d;--fg:#ffffff;--muted:#9aa5b1;
--line:#2c2c2a;--card:#1a1a19;--accent:#3987e5;--shadow:0 1px 3px rgba(0,0,0,.4);}}
*{box-sizing:border-box}
body{margin:0;padding:2.2rem 1.5rem 4rem;background:var(--bg);color:var(--fg);
font:15px/1.55 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;}
.wrap{max-width:1200px;margin:0 auto}
h1{font-size:1.75rem;font-weight:670;letter-spacing:-.018em;margin:0 0 .2rem}
.sub{color:var(--muted);margin:0 0 2.2rem;font-size:.92rem}
h2{font-size:1.05rem;font-weight:650;letter-spacing:-.01em;margin:0 0 .9rem}
.empty{padding:3rem 1rem;text-align:center;color:var(--muted);border:1px dashed var(--line);
border-radius:10px;}

.chart-card{background:var(--card);border:1px solid var(--line);border-radius:12px;
padding:1.1rem 1.3rem 1.3rem;box-shadow:var(--shadow);margin-bottom:2.2rem;}
.chart-sub{color:var(--muted);font-size:.78rem;margin:0 0 1rem}
.bar-row{display:flex;align-items:center;gap:.7rem;margin:.5rem 0;}
.bar-label{flex:0 0 11rem;font-size:.82rem;font-weight:600;text-align:right;
white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.bar-label a{color:inherit;text-decoration:none;}
.bar-label a:hover{text-decoration:underline;}
.bar-track{flex:1;background:color-mix(in srgb, var(--fg) 6%, transparent);
border-radius:4px;height:1.4rem;position:relative;overflow:hidden;}
.bar-fill{height:100%;border-radius:4px;transition:width .3s ease;}
.bar-value{flex:0 0 5.5rem;font-size:.8rem;font-variant-numeric:tabular-nums;
color:var(--muted);}

.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:1rem;}
.card{background:var(--card);border:1px solid var(--line);border-radius:12px;
padding:1rem 1.1rem;box-shadow:var(--shadow);transition:box-shadow .15s ease,transform .15s ease;}
.card:hover{box-shadow:0 4px 14px rgba(0,0,0,.1);transform:translateY(-1px);}
.card a{color:var(--fg);text-decoration:none;font-size:1.02rem;font-weight:650;
letter-spacing:-.012em;display:block;margin-bottom:.7rem;}
.card a:hover{color:var(--accent);}
.stats{display:grid;grid-template-columns:1fr 1fr;gap:.55rem .5rem;}
.stat b{display:block;font-size:1.05rem;font-variant-numeric:tabular-nums;font-weight:650;}
.stat span{display:block;font-size:.66rem;text-transform:uppercase;letter-spacing:.05em;
color:var(--muted);margin-top:.1rem;}
footer{margin-top:2.5rem;color:var(--muted);font-size:.78rem;border-top:1px solid var(--line);
padding-top:1rem;}
</style>

<div class="wrap">
  <h1>Materials</h1>
  <p class="sub" id="sub"></p>
  <div id="content"></div>
  <footer>Rendered from the indexed records. Regenerated automatically on every
    ingest -- if this looks stale, it will refresh itself the next time anyone
    commits a test. Open a material's own report for its full charts.</footer>
</div>

<script>
const DATA = /*__DATA__*/;
const PALETTE = ["#2a78d6","#eb6834","#1baf7a","#eda100","#e87ba4","#008300","#4a3aa7","#e34948"];

function esc(s){return String(s).replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));}
function fmtDate(iso){
  if(!iso) return "—";
  const d = new Date(iso);
  return isNaN(d) ? iso.slice(0,10) : d.toISOString().slice(0,10);
}

const materials = DATA.materials || [];
document.getElementById("sub").textContent =
  materials.length + " material" + (materials.length===1?"":"s") + " indexed";

const content = document.getElementById("content");
if(!materials.length){
  content.innerHTML = '<div class="empty">Nothing ingested into this workspace yet.</div>';
} else {
  const withPeak = materials.filter(m => m.meanPeak != null);
  let chartHtml = "";
  if(withPeak.length){
    const ranked = [...withPeak].sort((a,b) => b.meanPeak - a.meanPeak);
    const max = ranked[0].meanPeak;
    const rows = ranked.map((m,i) => `
      <div class="bar-row">
        <div class="bar-label"><a href="${esc(m.slug)}.html">${esc(m.material)}</a></div>
        <div class="bar-track"><div class="bar-fill" style="width:${(m.meanPeak/max*100).toFixed(1)}%;background:${PALETTE[i%PALETTE.length]}"></div></div>
        <div class="bar-value">${m.meanPeak.toFixed(1)} MPa</div>
      </div>`).join("");
    chartHtml = `
      <div class="chart-card">
        <h2>Mean peak stress by material</h2>
        <p class="chart-sub">Averaged across every specimen ever ingested for that material -- click a name to open its full report.</p>
        ${rows}
      </div>`;
  }

  const cards = materials.map(m => `
    <div class="card">
      <a href="${esc(m.slug)}.html">${esc(m.material)}</a>
      <div class="stats">
        <div class="stat"><b>${m.specimens}</b><span>Specimens</span></div>
        <div class="stat"><b>${m.runs}</b><span>Runs</span></div>
        <div class="stat"><b>${m.meanPeak != null ? m.meanPeak.toFixed(1) + " MPa" : "—"}</b><span>Mean peak</span></div>
        <div class="stat"><b>${fmtDate(m.lastIngested)}</b><span>Last ingested</span></div>
      </div>
    </div>`).join("");

  content.innerHTML = chartHtml + `<h2>Every material</h2><div class="grid">${cards}</div>`;
}
</script>
