<meta charset="utf-8">
<title>Compression Results</title>
<style>
/* ===========================================================================
   Palette
   ---------------------------------------------------------------------------
   --s1..--s8 are the validated categorical slots, assigned to specimens in
   fixed order and NEVER cycled: hiding a specimen must not repaint the ones
   that remain. Both modes are selected steps of the same eight hues, not an
   automatic flip. Verified with the dataviz validator on the adjacent pairlist
   (grouped bars sit side by side) against these exact surfaces:
     light  worst adjacent CVD dE 9.1, normal-vision 19.6  -> pass
     dark   worst adjacent CVD dE 8.4, normal-vision 19.3  -> pass
   Three light slots sit under 3:1 on the light surface, so the relief rule
   applies: every chart carries a legend, the expanded view direct-labels each
   bar, and the full values table lives on the Method tab.

   --avg is deliberately NOT a categorical slot. The mean is an aggregate, not
   another specimen; giving it a specimen hue would say it is one.

   BRAND: --brand drives the interactive accent only (active chips, focus
   rings, the tab underline) -- never a data mark, so rebranding cannot break
   a validated data palette. Swap the two --brand lines for EQYO's accent.
   =========================================================================== */
:root{
  color-scheme: light;
  --page:#f9f9f7; --surface:#fcfcfb; --sunk:#f2f1ed; --raised:#ffffff;
  --ink:#0b0b0b; --ink-2:#52514e; --muted:#898781;
  --grid:#e1e0d9; --axis:#c3c2b7;
  --ring:rgba(11,11,11,.10); --ring-2:rgba(11,11,11,.16);
  --s1:#2a78d6; --s2:#eb6834; --s3:#1baf7a; --s4:#eda100;
  --s5:#e87ba4; --s6:#008300; --s7:#4a3aa7; --s8:#e34948;
  --avg:#52514e;
  --brand:#2a78d6; --brand-ink:#ffffff;
  --sans:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  --mono:ui-monospace,SFMono-Regular,"SF Mono",Menlo,Consolas,monospace;
  --shadow-1:0 1px 2px rgba(0,0,0,.05), 0 1px 3px rgba(0,0,0,.04);
  --shadow-2:0 4px 12px rgba(0,0,0,.07), 0 1px 3px rgba(0,0,0,.05);
  --shadow-3:0 16px 48px rgba(0,0,0,.18), 0 2px 8px rgba(0,0,0,.10);
  --r-sm:6px; --r-md:9px; --r-lg:13px;
  --ease:cubic-bezier(.22,.61,.36,1);
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  color-scheme: dark;
  --page:#0d0d0d; --surface:#1a1a19; --sunk:#232322; --raised:#232322;
  --ink:#ffffff; --ink-2:#c3c2b7; --muted:#898781;
  --grid:#2c2c2a; --axis:#383835;
  --ring:rgba(255,255,255,.10); --ring-2:rgba(255,255,255,.17);
  --s1:#3987e5; --s2:#d95926; --s3:#199e70; --s4:#c98500;
  --s5:#d55181; --s6:#008300; --s7:#9085e9; --s8:#e66767;
  --avg:#c3c2b7;
  --brand:#3987e5; --brand-ink:#ffffff;
  --shadow-1:0 1px 2px rgba(0,0,0,.30);
  --shadow-2:0 4px 14px rgba(0,0,0,.42);
  --shadow-3:0 18px 52px rgba(0,0,0,.62), 0 2px 10px rgba(0,0,0,.45);
}}
:root[data-theme="dark"]{
  color-scheme: dark;
  --page:#0d0d0d; --surface:#1a1a19; --sunk:#232322; --raised:#232322;
  --ink:#ffffff; --ink-2:#c3c2b7; --muted:#898781;
  --grid:#2c2c2a; --axis:#383835;
  --ring:rgba(255,255,255,.10); --ring-2:rgba(255,255,255,.17);
  --s1:#3987e5; --s2:#d95926; --s3:#199e70; --s4:#c98500;
  --s5:#d55181; --s6:#008300; --s7:#9085e9; --s8:#e66767;
  --avg:#c3c2b7;
  --brand:#3987e5; --brand-ink:#ffffff;
  --shadow-1:0 1px 2px rgba(0,0,0,.30);
  --shadow-2:0 4px 14px rgba(0,0,0,.42);
  --shadow-3:0 18px 52px rgba(0,0,0,.62), 0 2px 10px rgba(0,0,0,.45);
}

*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--page);color:var(--ink);font-family:var(--sans);
  font-size:15px;line-height:1.55;-webkit-font-smoothing:antialiased;
  text-rendering:optimizeLegibility;}
.wrap{max-width:1400px;margin:0 auto;padding:1.5rem 1.15rem 4rem;}

/* header */
.top{display:flex;flex-wrap:wrap;gap:.9rem 1.5rem;align-items:flex-end;
  justify-content:space-between;padding-bottom:1rem;}
.eyebrow{font-size:.68rem;font-weight:700;letter-spacing:.13em;
  text-transform:uppercase;color:var(--muted);margin-bottom:.2rem;}
h1{font-size:1.4rem;margin:0;letter-spacing:-.022em;font-weight:670;line-height:1.2;
  word-break:break-word;}
.hright{display:flex;align-items:center;gap:.9rem;flex-wrap:wrap;}
.meta{display:flex;flex-wrap:wrap;gap:.3rem;}
.mchip{display:inline-flex;align-items:baseline;gap:.32rem;font-size:.72rem;
  padding:.2rem .5rem;border-radius:var(--r-sm);background:var(--surface);
  border:1px solid var(--ring);font-variant-numeric:tabular-nums;color:var(--ink);}
.mchip b{color:var(--muted);font-weight:600;font-size:.66rem;
  text-transform:uppercase;letter-spacing:.05em;}

/* warnings -- same severity vocabulary (critical/caution/info) as the
   static multi-material report (html_report.py), independent CSS since the
   two templates share no stylesheet. */
:root{
  --warn-bg:#fff4d6; --warn-fg:#7a5c00;
  --bad-bg:#fde4e4; --bad-fg:#9c0006;
  --info-bg:#e8eefa; --info-fg:#1f3864;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --warn-bg:#3d3312; --warn-fg:#f0d68a;
  --bad-bg:#3d1f1f; --bad-fg:#f2a3a3;
  --info-bg:#1c2a3d; --info-fg:#8fb0e8;
}}
:root[data-theme="dark"]{
  --warn-bg:#3d3312; --warn-fg:#f0d68a;
  --bad-bg:#3d1f1f; --bad-fg:#f2a3a3;
  --info-bg:#1c2a3d; --info-fg:#8fb0e8;
}
.warnbar{margin:0 0 1.1rem;}
/* Collapsed by default: a row of small severity chips (one per severity
   PRESENT, each carrying its own count), not the full message text sitting
   permanently in the page. Any chip opens the same shared panel below --
   there is one list of warnings to read, not one per severity, so a
   separate open/closed state per chip would just be more clicks to see
   everything. */
.warnchips{display:flex;flex-wrap:wrap;gap:.4rem;}
.warnchip{display:inline-flex;align-items:center;gap:.4rem;font:inherit;
  font-size:.78rem;font-weight:650;padding:.3rem .65rem;border-radius:999px;
  border:1px solid transparent;cursor:pointer;
  transition:filter .15s var(--ease), transform .12s var(--ease);}
.warnchip:hover{filter:brightness(.96);}
.warnchip:active{transform:scale(.97);}
.warnchip .n{font-variant-numeric:tabular-nums;opacity:.8;}
.warnchip .chev{width:9px;height:9px;flex:none;transition:transform .18s var(--ease);}
.warnchip[aria-expanded="true"] .chev{transform:rotate(180deg);}
.warnchip.critical{background:var(--bad-bg);color:var(--bad-fg);}
.warnchip.caution{background:var(--warn-bg);color:var(--warn-fg);}
.warnchip.info{background:var(--info-bg);color:var(--info-fg);}
.warnchip:focus-visible{outline:2px solid var(--brand);outline-offset:2px;}

.warnpanel{display:flex;flex-direction:column;gap:.5rem;margin-top:.55rem;}
.warnpanel[hidden]{display:none;}
.warncard{display:flex;gap:.6rem;align-items:flex-start;padding:.6rem .8rem;
  border-radius:var(--r-md);font-size:.82rem;line-height:1.5;
  animation:fadeIn .18s var(--ease) both;}
.warncard .pill{flex:none;font-size:.63rem;font-weight:700;letter-spacing:.04em;
  text-transform:uppercase;padding:.12rem .45rem;border-radius:999px;
  background:rgba(0,0,0,.12);}
.warncard.critical{background:var(--bad-bg);color:var(--bad-fg);}
.warncard.caution{background:var(--warn-bg);color:var(--warn-fg);}
.warncard.info{background:var(--info-bg);color:var(--info-fg);}

/* theme toggle */
.seg{display:inline-flex;background:var(--sunk);border:1px solid var(--ring);
  border-radius:var(--r-sm);padding:2px;gap:2px;}
.seg button{border:none;background:none;cursor:pointer;padding:.24rem .42rem;
  border-radius:4px;color:var(--muted);display:grid;place-items:center;
  transition:background .16s var(--ease), color .16s var(--ease);}
.seg button svg{width:14px;height:14px;display:block}
.seg button:hover{color:var(--ink)}
.seg button[aria-pressed="true"]{background:var(--raised);color:var(--ink);
  box-shadow:var(--shadow-1);}
.seg button:focus-visible{outline:2px solid var(--brand);outline-offset:1px}

/* tabs */
.tabs{display:flex;gap:.15rem;border-bottom:1px solid var(--grid);
  margin:0 0 1.25rem;position:relative;}
.tabs button{font:inherit;font-size:.88rem;font-weight:600;padding:.55rem .9rem;
  border:none;background:none;color:var(--muted);cursor:pointer;
  border-bottom:2px solid transparent;margin-bottom:-1px;
  transition:color .16s var(--ease);}
.tabs button:hover{color:var(--ink);}
.tabs button[aria-selected="true"]{color:var(--ink);border-bottom-color:var(--brand);}
.tabs button:focus-visible{outline:2px solid var(--brand);outline-offset:-2px;
  border-radius:4px;}
[role="tabpanel"][hidden]{display:none;}
[role="tabpanel"]{animation:fadeIn .26s var(--ease) both;}
@keyframes fadeIn{from{opacity:0;transform:translateY(4px)}to{opacity:1;transform:none}}

/* control bar */
.bar{display:flex;flex-wrap:wrap;gap:.5rem .9rem;align-items:center;
  margin-bottom:1.1rem;padding:.55rem .7rem;background:var(--surface);
  border:1px solid var(--ring);border-radius:var(--r-md);box-shadow:var(--shadow-1);}
.grp{display:flex;gap:.3rem;align-items:center;flex-wrap:wrap;}
.grp>.lbl{font-size:.66rem;color:var(--muted);text-transform:uppercase;
  letter-spacing:.09em;font-weight:700;margin-right:.1rem;}
button.chip{font:inherit;font-size:.78rem;font-weight:560;padding:.26rem .55rem;
  border-radius:var(--r-sm);border:1px solid var(--ring);background:var(--raised);
  color:var(--ink-2);cursor:pointer;font-variant-numeric:tabular-nums;
  line-height:1.25;display:inline-flex;align-items:center;gap:.34rem;
  transition:background .15s var(--ease), color .15s var(--ease),
    border-color .15s var(--ease), transform .12s var(--ease);}
button.chip:hover{background:var(--sunk);color:var(--ink);border-color:var(--ring-2);}
button.chip:active{transform:scale(.97);}
button.chip .sw{width:9px;height:9px;border-radius:2.5px;flex:none;
  transition:opacity .15s var(--ease), transform .15s var(--ease);}
button.chip[aria-pressed="false"]{color:var(--muted);background:transparent;}
button.chip[aria-pressed="false"] .sw{opacity:.28;transform:scale(.82);}
button.chip[aria-pressed="true"]{border-color:var(--ring-2);background:var(--sunk);
  color:var(--ink);}
button.chip:focus-visible{outline:2px solid var(--brand);outline-offset:2px;}
.barnote{font-size:.74rem;color:var(--muted);margin-left:auto;}
.linkish{background:none;border:none;font:inherit;font-size:.74rem;color:var(--brand);
  cursor:pointer;padding:.15rem .3rem;border-radius:4px;font-weight:560;}
.linkish:hover{background:var(--sunk);}
.linkish:focus-visible{outline:2px solid var(--brand);outline-offset:1px;}

/* chart grid */
.grid{display:grid;gap:.85rem;
  grid-template-columns:repeat(auto-fit,minmax(min(var(--cell-min,340px),100%),1fr));}
.cell{background:var(--surface);border:1px solid var(--ring);
  border-radius:var(--r-lg);padding:.8rem .85rem .55rem;position:relative;
  box-shadow:var(--shadow-1);
  transition:box-shadow .2s var(--ease), border-color .2s var(--ease),
    transform .2s var(--ease);}
.cell:hover{box-shadow:var(--shadow-2);border-color:var(--ring-2);transform:translateY(-1px);}
.cell .hd{display:flex;justify-content:space-between;align-items:flex-start;
  gap:.5rem;margin-bottom:.45rem;}
.cell h3{margin:0 0 .06rem;font-size:.88rem;font-weight:650;letter-spacing:-.012em;}
.cell .u{margin:0;font-size:.71rem;color:var(--muted);line-height:1.35;}
.wide{grid-column:1/-1;}
.plot{cursor:zoom-in;}
svg{display:block;width:100%;height:auto;overflow:visible;}
.gl{stroke:var(--grid);stroke-width:1;}
.ax{stroke:var(--axis);stroke-width:1;}
.tk{fill:var(--muted);font-size:10px;font-variant-numeric:tabular-nums;}
.altl{fill:var(--ink-2);font-size:10.5px;font-weight:600;}
.vl{fill:var(--ink-2);font-size:9px;font-variant-numeric:tabular-nums;font-weight:600;}
.lgd{fill:var(--ink-2);font-size:10px;font-weight:600;}

/* Staggered reveal. --i is set per cell; capped so a long grid does not spend
   a second and a half arriving. */
@media (prefers-reduced-motion:no-preference){
  .cell{animation:cellIn .34s var(--ease) both;animation-delay:calc(var(--i,0)*38ms);}
  @keyframes cellIn{from{opacity:0;transform:translateY(9px)}to{opacity:1;transform:none}}
  .bar-mark{transform-box:fill-box;transform-origin:50% 100%;
    animation:barIn .42s var(--ease) both;animation-delay:calc(var(--bi,0)*14ms);}
  @keyframes barIn{from{transform:scaleY(0)}to{transform:scaleY(1)}}
  .loop-path{animation:loopIn .5s var(--ease) both;}
  @keyframes loopIn{from{opacity:0}to{opacity:.9}}
}
.bar-mark{transition:filter .13s var(--ease);}
.bar-mark:hover{filter:brightness(1.12) saturate(1.06);}
/* Export freeze: animations off, so the base (full-size) state is what
   getComputedStyle reports and a chart exported mid-reveal is complete. */
svg.exporting, svg.exporting *{animation:none!important;transition:none!important;}

/* per-chart actions */
.acts{display:flex;gap:.1rem;opacity:0;flex:none;
  transition:opacity .16s var(--ease);}
.cell:hover .acts,.cell:focus-within .acts,.dlg .acts{opacity:1;}
@media (hover:none){.acts{opacity:1;}}
.ico{width:27px;height:27px;display:grid;place-items:center;border-radius:var(--r-sm);
  border:1px solid transparent;background:none;color:var(--muted);cursor:pointer;
  padding:0;transition:background .15s var(--ease), color .15s var(--ease),
    border-color .15s var(--ease), transform .12s var(--ease);}
.ico:hover{background:var(--sunk);color:var(--ink);border-color:var(--ring);}
.ico:active{transform:scale(.92);}
.ico:focus-visible{outline:2px solid var(--brand);outline-offset:1px;}
.ico svg{width:15px;height:15px;overflow:visible;}

/* expanded dialog */
.dlg{border:none;padding:0;background:transparent;max-width:none;max-height:none;
  width:100%;height:100%;}
.dlg::backdrop{background:rgba(0,0,0,.55);backdrop-filter:blur(4px);}
.dlg .panel{background:var(--page);color:var(--ink);border-radius:var(--r-lg);
  box-shadow:var(--shadow-3);width:min(1180px,95vw);height:min(78vh,680px);
  /* Deliberately well under the iframe's own fixed viewport height, not just
     under 100%: when this page is embedded (Streamlit's components.html),
     the outer page's scroll position can shift where the iframe's box sits
     relative to the browser's actual visible window between the moment a
     chart is scrolled into view and the moment its dialog opens. Margin here
     is what keeps the whole dialog on screen through that shift, since this
     page cannot see the outer page's scroll position to compensate exactly. */
  margin:auto;display:flex;flex-direction:column;overflow:hidden;
  border:1px solid var(--ring);}
.dlg .bar2{display:flex;justify-content:space-between;align-items:flex-start;
  gap:1rem;padding:.9rem 1.1rem .6rem;border-bottom:1px solid var(--grid);flex:none;}
.dlg h3{margin:0;font-size:1.06rem;font-weight:660;letter-spacing:-.016em;}
.dlg .u{margin:.12rem 0 0;font-size:.78rem;color:var(--muted);}
.dlg .body{padding:.85rem 1.1rem 1rem;flex:1;min-height:0;
  display:flex;flex-direction:column;gap:.7rem;}
#dlg-plot{flex:1;min-height:0;}
#dlg-plot svg{width:100%;height:100%;}
.dlg .why{margin:0;font-size:.82rem;color:var(--ink-2);max-width:92ch;flex:none;}
@media (prefers-reduced-motion:no-preference){
  .dlg[open]{animation:pop .2s var(--ease);}
  @keyframes pop{from{opacity:0;transform:scale(.975) translateY(6px)}to{opacity:1;transform:none}}
  .dlg[open]::backdrop{animation:fade .2s var(--ease);}
  @keyframes fade{from{opacity:0}to{opacity:1}}
}

/* PNG fallback surface */
#img-dlg .panel{padding:.9rem 1.1rem 1.1rem;gap:.6rem;}
#img-dlg img{max-width:100%;max-height:100%;object-fit:contain;display:block;
  margin:0 auto;border:1px solid var(--ring);border-radius:var(--r-sm);background:#fff;}
#img-wrap{flex:1;min-height:0;display:flex;}
#img-hint{font-size:.82rem;color:var(--ink-2);margin:0;flex:none;}
#img-hint b{color:var(--ink);}

/* table */
.tw{overflow:auto;max-height:620px;border:1px solid var(--ring);
  border-radius:var(--r-md);background:var(--surface);box-shadow:var(--shadow-1);}
table{border-collapse:collapse;width:100%;font-size:.77rem;
  font-variant-numeric:tabular-nums;}
th,td{padding:.36rem .62rem;text-align:right;white-space:nowrap;
  border-bottom:1px solid var(--grid);}
th{color:var(--muted);font-weight:650;font-size:.65rem;letter-spacing:.04em;
  text-transform:uppercase;background:var(--sunk);position:sticky;top:0;z-index:1;}
th:first-child,td:first-child{text-align:left;position:sticky;left:0;
  background:var(--surface);}
th:first-child{background:var(--sunk);z-index:2;}
tbody tr{transition:background .12s var(--ease);}
tbody tr:hover td{background:var(--sunk);}
tbody tr.sep td{border-top:2px solid var(--axis);}
td .dot{display:inline-block;width:8px;height:8px;border-radius:2.5px;
  margin-right:.4rem;vertical-align:-1px;}

/* method tab */
.mh{font-size:1.1rem;margin:0 0 .55rem;font-weight:660;letter-spacing:-.016em;}
.prose{max-width:76ch;}
.prose h2{font-size:1.1rem;margin:2.1rem 0 .4rem;font-weight:660;letter-spacing:-.016em;}
.prose p,.prose li{color:var(--ink-2);}
.prose code{font-family:var(--mono);font-size:.85em;background:var(--sunk);
  padding:.1em .34em;border-radius:3px;color:var(--ink);}
.dict{width:100%;font-size:.82rem;}
.dict td{text-align:left;white-space:normal;vertical-align:top;}
.dict td:first-child{font-weight:640;color:var(--ink);width:15rem;position:static;}
.dict td:nth-child(2){color:var(--muted);white-space:nowrap;width:5rem;text-align:center;}
.note{font-size:.79rem;color:var(--muted);margin:.5rem 0 1rem;}
.empty{padding:2.5rem 1rem;text-align:center;color:var(--muted);font-size:.86rem;
  border:1px dashed var(--ring-2);border-radius:var(--r-md);}

/* overlays */
#tip{position:fixed;pointer-events:none;z-index:90;opacity:0;
  transition:opacity .1s var(--ease), transform .1s var(--ease);
  transform:translateY(3px);
  background:var(--raised);border:1px solid var(--ring-2);border-radius:var(--r-sm);
  padding:.48rem .62rem;font-size:.77rem;box-shadow:var(--shadow-2);
  font-variant-numeric:tabular-nums;max-width:280px;}
#tip.on{opacity:1;transform:none;}
#tip .t{font-weight:660;margin-bottom:.22rem;display:flex;align-items:center;gap:.36rem;}
#tip .t i{width:9px;height:9px;border-radius:2.5px;display:inline-block;flex:none;}
#tip .r{display:flex;justify-content:space-between;gap:1.1rem;color:var(--ink-2);}
#tip .r b{color:var(--ink);font-weight:600;}
#toast{position:fixed;left:50%;bottom:1.6rem;transform:translateX(-50%) translateY(10px);
  background:var(--ink);color:var(--page);font-size:.8rem;font-weight:560;
  padding:.55rem .95rem;border-radius:var(--r-sm);opacity:0;pointer-events:none;
  z-index:100;transition:opacity .18s var(--ease), transform .18s var(--ease);
  box-shadow:var(--shadow-3);max-width:80vw;text-align:center;}
#toast.on{opacity:1;transform:translateX(-50%);}
footer{margin-top:2.5rem;padding-top:1rem;border-top:1px solid var(--grid);
  font-size:.74rem;color:var(--muted);}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
@media (max-width:560px){
  .wrap{padding:1.1rem .75rem 3rem}
  h1{font-size:1.15rem}
  .barnote{margin-left:0;width:100%}
}
</style>

<div class="wrap">
  <header class="top">
    <div>
      <div class="eyebrow" id="eyebrow">Multi-stage compression test</div>
      <h1 id="title">Compression Results</h1>
    </div>
    <div class="hright">
      <div class="meta" id="meta"></div>
      <div class="seg" role="group" aria-label="Language" id="lang"></div>
      <div class="seg" role="group" aria-label="Colour theme" id="theme"></div>
    </div>
  </header>

  <div class="warnbar" id="warnbar"></div>

  <div class="tabs" role="tablist">
    <button role="tab" id="t-res" aria-controls="p-res" aria-selected="true">Results</button>
    <button role="tab" id="t-met" aria-controls="p-met" aria-selected="false">Method</button>
  </div>

  <div role="tabpanel" id="p-res" aria-labelledby="t-res">
    <div class="bar" id="ctrls"></div>
    <div class="grid" id="charts"></div>
  </div>

  <div role="tabpanel" id="p-met" aria-labelledby="t-met" hidden>
    <h2 class="mh" id="mh-allvalues">All values</h2>
    <div class="tw"><table id="tbl"></table></div>
    <p class="note" id="dlnote"></p>
    <div class="prose" id="method"></div>
  </div>

  <footer id="foot"></footer>
</div>

<dialog class="dlg" id="dlg">
  <div class="panel">
    <div class="bar2">

<script>
const DATA = /*__DATA__*/;
const $ = s => document.querySelector(s);
const NS = "http://www.w3.org/2000/svg";
const SPS = DATA.specimens || [];
const NC = SPS.length ? SPS[0].cycles.length : 0;

/* Categorical slots are assigned by specimen INDEX and never recomputed from
   what is currently visible -- that is what keeps a hidden specimen from
   repainting the others. */
const SLOTS = 8;
const colourOf = i => `var(--s${(i % SLOTS) + 1})`;

const state = {
  hidden: new Set(),            // specimen indices toggled off
  avg: SPS.length > 1,          // show the per-cycle mean
};

/* ---- language ------------------------------------------------------------
   Two-way toggle (EN/DE), same persisted-choice pattern as the theme toggle.
   L() resolves a {en,de} pair (or a plain string, unchanged) against the
   current LANG. Numbers are NOT reformatted for German convention (comma
   decimal separator) -- fmt() below is unchanged on purpose. Warning
   messages in DATA.warnings are generated server-side (diagnostics.py) and
   stay in English; only this template's own strings are translated. */
let LANG = "en";
try{
  // window.__CT_LANG__ is set by the app's ONE shared sidebar toggle
  // (webapp/common.py's inject_dashboard_lang), ahead of this script, when
  // this page is embedded from Streamlit -- it wins over this page's own
  // remembered choice so every embedded dashboard opens in whatever the
  // sidebar is set to, not whatever this one iframe last saw. A file opened
  // directly from disk (no Streamlit) never gets that global set, so it
  // keeps this page's own localStorage-remembered choice as before.
  LANG = window.__CT_LANG__ || localStorage.getItem("ct-lang") || "en";
}catch(e){}
const L = x => x==null ? x : (typeof x === "string" ? x : (x[LANG] ?? x.en));
const UI = {
  tabResults:{en:"Results",de:"Ergebnisse"},
  tabMethod:{en:"Method",de:"Methode"},
  eyebrow:{en:"Multi-stage compression test",de:"Mehrstufiger Druckversuch"},
  defaultTitle:{en:"Compression Results",de:"Druckversuchsergebnisse"},
  specimensLbl:{en:"Specimens",de:"Proben"},
  cyclesLbl:{en:"Cycles",de:"Zyklen"},
  peakLbl:{en:"Peak",de:"Spitze"},
  channelLbl:{en:"Channel",de:"Kanal"},
  avg:{en:"Avg",de:"Mittel"},
  avgTitle:{en:"Mean of the specimens shown, per cycle",de:"Mittelwert der angezeigten Proben, je Zyklus"},
  showAll:{en:"Show all",de:"Alle einblenden"},
  hideAll:{en:"Hide all",de:"Alle ausblenden"},
  emptyHidden:{en:"Every specimen is hidden. Turn one back on above to see the charts.",
    de:"Alle Proben sind ausgeblendet. Oben mindestens eine wieder einblenden, um die Diagramme zu sehen."},
  copyPng:{en:"Copy chart as PNG",de:"Diagramm als PNG kopieren"},
  downloadPng:{en:"Download PNG",de:"PNG herunterladen"},
  expandLbl:{en:"Expand",de:"Vergrößern"},
  closeLbl:{en:"Close",de:"Schließen"},
  toastNoRender:{en:"Could not render the chart",de:"Diagramm konnte nicht erzeugt werden"},
  toastCopied:{en:"Chart copied, paste into Word, Teams or PowerPoint",
    de:"Diagramm kopiert, in Word, Teams oder PowerPoint einfügen"},
  toastPngDownloaded:{en:"PNG downloaded",de:"PNG heruntergeladen"},
  toastNothingToExport:{en:"Nothing to export: no specimen is shown",
    de:"Nichts zu exportieren: keine Probe wird angezeigt"},
  clipboardHint:{
    en:"This preview does not give the page clipboard access, so the chart is shown here "+
       "instead. <b>Right-click it → “Copy image”</b> and paste it straight into Word or "+
       "PowerPoint. Opened outside the preview, the Copy button works directly.",
    de:"Diese Vorschau gewährt der Seite keinen Zugriff auf die Zwischenablage, daher wird "+
       "das Diagramm stattdessen hier angezeigt. <b>Rechtsklick darauf → „Bild kopieren“</b> "+
       "und direkt in Word oder PowerPoint einfügen. Außerhalb der Vorschau geöffnet, "+
       "funktioniert die Kopieren-Schaltfläche direkt."},
  downloadHint:{
    en:"This preview blocks downloads that a page starts itself, so the PNG is shown here "+
       "instead. <b>Right-click it → “Save image as…”</b> to keep the file. Opened outside "+
       "the preview, the Download button saves it directly.",
    de:"Diese Vorschau blockiert Downloads, die eine Seite selbst auslöst, daher wird die "+
       "PNG-Datei stattdessen hier angezeigt. <b>Rechtsklick darauf → „Bild speichern unter…“</b>, "+
       "um die Datei zu behalten. Außerhalb der Vorschau geöffnet, speichert die "+
       "Download-Schaltfläche die Datei direkt."},
  rightClickHint:{en:"Right-click the image to copy or save it",
    de:"Rechtsklick auf das Bild zum Kopieren oder Speichern"},
  chartExportAlt:{en:"Chart export",de:"Diagramm-Export"},
  allValues:{en:"All values",de:"Alle Werte"},
  exportNote:{en:"Charts export to PNG from the toolbar on each one, or from the expanded view.",
    de:"Diagramme lassen sich über die Symbolleiste an jedem Diagramm oder in der "+
       "vergrößerten Ansicht als PNG exportieren."},
  footerNote:{
    en:"Rendered from the frozen JSON record (schema v2). Curves are reduced for drawing "+
       "only; every number is computed on the full signal.",
    de:"Erzeugt aus dem eingefrorenen JSON-Datensatz (Schema v2). Kurven sind nur für die "+
       "Darstellung reduziert; jede Zahl wird aus dem vollständigen Signal berechnet."},
  colourTheme:{en:"Colour theme",de:"Farbschema"},
  language:{en:"Language",de:"Sprache"},
  cycleAxis:{en:"Cycle",de:"Zyklus"},
  stressAxis:{en:"Stress (MPa)",de:"Spannung (MPa)"},
  dispAxisUm:{en:"Displacement (µm)",de:"Verschiebung (µm)"},
  fewPoints:{en:"few points",de:"wenige Punkte"},
  nonlinear:{en:"nonlinear",de:"nichtlinear"},
  fitQualityLbl:{en:"Fit quality",de:"Anpassungsgüte"},
  peakStressTip:{en:"Peak stress",de:"Spitzenspannung"},
  critical:{en:"Critical",de:"Kritisch"},
  caution:{en:"Caution",de:"Achtung"},
  info:{en:"Info",de:"Info"},
};

const fmt = (v,d=2) => v==null||Number.isNaN(v) ? "-"
  : v.toLocaleString(undefined,{minimumFractionDigits:d,maximumFractionDigits:d});
function el(t,a={},p=null){const e=document.createElementNS(NS,t);
  for(const k in a) e.setAttribute(k,a[k]); if(p) p.appendChild(e); return e;}
function svg(host,w,h){host.innerHTML="";
  const s=el("svg",{viewBox:`0 0 ${w} ${h}`,role:"img"});
  host.appendChild(s);return s;}

/* Fit-quality classification for the common-band stiffness -- must stay in
   lock-step with stiffness_quality() in schema.py, the single source of
   truth every other artefact (Excel, the values table) already derives
   this from. */
const QUALITY_MIN_POINTS=10, QUALITY_MIN_R2=0.95;
function stiffQuality(n,r2){
  if(n==null||r2==null) return "none";
  if(n<QUALITY_MIN_POINTS) return "few points";
  if(r2<QUALITY_MIN_R2) return "nonlinear";
  return "ok";
}
const qualityLabel = q => q==="few points" ? L(UI.fewPoints) : q==="nonlinear" ? L(UI.nonlinear) : q;
/* Diagonal hatch, one <pattern> per chart instance (ids must be unique only
   within their own SVG, but several charts share one page) -- laid OVER a
   dimmed bar so a shaky fit is never drawn identically to a solid one. */
let hatchSeq=0;
function ensureHatch(root){
  if(root.__hatchId) return root.__hatchId;
  const id=`hatch${hatchSeq++}`;
  const defs=el("defs",{},root);
  const pat=el("pattern",{id,width:6,height:6,patternTransform:"rotate(45)",
    patternUnits:"userSpaceOnUse"},defs);
  el("line",{x1:0,y1:0,x2:0,y2:6,stroke:"var(--ink)",opacity:.55,"stroke-width":2},pat);
  root.__hatchId=id;
  return id;
}

const visible = () => SPS.map((s,i)=>i).filter(i=>!state.hidden.has(i));

/* Series actually drawn. Colour follows the specimen, never its position in
   this list, so filtering never repaints a survivor. */
function series(){
  const out = visible().map(i => ({key:i, name:SPS[i].short, colour:colourOf(i)}));
  if (state.avg && out.length > 1)
    out.push({key:"avg", name:L(UI.avg), colour:"var(--avg)", isAvg:true});
  return out;
}
const valOf = (ser, key, n) => {
  if (ser.key === "avg"){
    const vs = visible().map(i => SPS[i].cycles.find(c=>c.n===n)?.[key])
      .filter(v => v!=null);
    return vs.length ? vs.reduce((a,b)=>a+b,0)/vs.length : null;
  }
  const c = SPS[ser.key].cycles.find(c=>c.n===n);
  return c ? c[key] : null;
};

/* tooltip / toast */
const tip = $("#tip");
function showTip(ev,title,swatch,rows){
  tip.innerHTML = `<div class="t">${swatch?`<i style="background:${swatch}"></i>`:""}${title}</div>` +
    rows.map(([k,v])=>`<div class="r"><span>${k}</span><b>${v}</b></div>`).join("");
  tip.classList.add("on");
  const pad=14,r=tip.getBoundingClientRect();
  let x=ev.clientX+pad,y=ev.clientY+pad;
  if(x+r.width>innerWidth-8) x=ev.clientX-r.width-pad;
  if(y+r.height>innerHeight-8) y=ev.clientY-r.height-pad;
  tip.style.left=x+"px"; tip.style.top=y+"px";
}
const hideTip = () => tip.classList.remove("on");

let toastTimer;
function toast(msg){
  const t=$("#toast"); t.textContent=msg; t.classList.add("on");
  clearTimeout(toastTimer); toastTimer=setTimeout(()=>t.classList.remove("on"),2200);
}

/* axes */
function ticks(lo,hi,n=4){
  const span=hi-lo; if(!(span>0)) return [lo];
  const mag=Math.pow(10,Math.floor(Math.log10(span/n)));
  const step=[1,2,2.5,5,10].map(m=>m*mag).find(s=>span/s<=n*1.4)||mag*10;
  const out=[]; for(let v=Math.ceil(lo/step)*step; v<=hi+step*1e-6; v+=step) out.push(+v.toFixed(10));
  return out;
}
function axes(s,m,w,h,yd,yfmt,xlab){
  const Y=v=>h-m.b-(v-yd[0])/(yd[1]-yd[0])*(h-m.t-m.b);
  for(const t of ticks(yd[0],yd[1])){
    if(t<yd[0]||t>yd[1]) continue;
    el("line",{x1:m.l,x2:w-m.r,y1:Y(t),y2:Y(t),class:"gl"},s);
    const tx=el("text",{x:m.l-6,y:Y(t)+3.4,class:"tk","text-anchor":"end"},s);
    tx.textContent=yfmt(t);
  }
  el("line",{x1:m.l,x2:w-m.r,y1:Y(Math.max(yd[0],0)),y2:Y(Math.max(yd[0],0)),class:"ax"},s);
  if(xlab){const t=el("text",{x:(m.l+w-m.r)/2,y:h-2,class:"altl","text-anchor":"middle"},s);
    t.textContent=xlab;}
  return Y;
}

/* Legend inside the SVG, so a copied or downloaded chart carries its own key.
   Widths are estimated from the label text rather than measured -- labels are
   "S1".."S8" and "Avg", so an estimate is exact enough and avoids a layout
   pass per chart. Wraps to another row when the series no longer fit. */
function drawLegend(root, ser, x0, y, big, maxX){
  const fs = big ? 13 : 10, sw = big ? 11 : 9, gap = big ? 7 : 5;
  const rowH = big ? 17 : 13;
  let x = x0, row = 0;
  ser.forEach(s=>{
    const wNeeded = sw + gap + s.name.length*fs*0.62 + (big?20:14);
    if (maxX && x + wNeeded > maxX && x > x0){ row++; x = x0; }
    const yy = y + row*rowH;
    el("rect",{x, y:yy-sw+1, width:sw, height:sw, rx:2.5, fill:s.colour},root);
    const t=el("text",{x:x+sw+gap, y:yy, class:"lgd", style:`font-size:${fs}px`},root);
    t.textContent=s.name;
    x += wNeeded;
  });
  return row + 1;
}
/* How many legend rows a given width will need -- the panel has to reserve
   the height before the legend is drawn into it. */
function legendRows(ser, x0, maxX, big){
  const fs = big ? 13 : 10, sw = big ? 11 : 9, gap = big ? 7 : 5;
  let x = x0, rows = 1;
  ser.forEach(s=>{
    const wNeeded = sw + gap + s.name.length*fs*0.62 + (big?20:14);
    if (x + wNeeded > maxX && x > x0){ rows++; x = x0; }
    x += wNeeded;
  });
  return rows;
}

/* Panel geometry adapts to the series count: with more specimens on screen the
   viewBox widens so bars keep a legible thickness, and because the grid's
   column width is driven by the same number the grid drops to fewer columns
   instead of squeezing. Capped so it never falls below two columns. */
const MIN_BAR = 5, BAR_GAP = 2, GROUP_PAD = 8, PANEL_CAP = 530;
function panelWidth(nSer){
  const need = NC * (nSer*(MIN_BAR+BAR_GAP) + GROUP_PAD) + 60;
  return Math.max(340, Math.min(need, PANEL_CAP));
}
const RATIO = 360/220;

/* grouped bars */
function barChart(host, spec, big=false, aspect=null){
  const ser = series();
  if(!ser.length){ host.innerHTML=""; return; }
  const W = big ? 1000 : panelWidth(ser.length);
  const H = Math.round(W / (aspect || RATIO));
  const k = W/360;
  const rows = legendRows(ser, 46*k, W-10*k, big);
  const legH = (big ? 26 : 18) + (rows-1)*(big?17:13);
  const m={l:46*k, r:10*k, t:12*k+legH, b:26*k};
  const root=svg(host,W,H);
  drawLegend(root, ser, 46*k, legH-(big?12:8), big, W-10*k);

  const sc = spec.scale || 1;
  const vals=[];
  for(let n=1;n<=NC;n++) ser.forEach(s=>{const v=valOf(s,spec.k,n); if(v!=null) vals.push(v*sc);});
  if(!vals.length) return;
  const hi=Math.max(...vals), lo=Math.min(0,Math.min(...vals));
  const yd=[lo, hi*(big?1.08:1.12) || 1];
  const Y=axes(root,m,W,H,yd,spec.f,L(UI.cycleAxis));
  if(big){
    const yl=el("text",{x:0,y:0,class:"altl","text-anchor":"middle",
      transform:`translate(13 ${(m.t+H-m.b)/2}) rotate(-90)`},root);
    yl.textContent=spec.u2 || L(spec.t);
  }

  const gw=(W-m.l-m.r)/NC, bw=Math.max(2.5,(gw-6*k)/ser.length-2*k);
  let bi=0;
  for(let n=1;n<=NC;n++){
    const gx=m.l+(n-1)*gw+3*k;
    const tx=el("text",{x:m.l+(n-.5)*gw,y:H-m.b+12*k,class:"tk","text-anchor":"middle"},root);
    tx.textContent=n;
    if(big) tx.setAttribute("style","font-size:13px");
    ser.forEach((s,si)=>{
      const raw=valOf(s,spec.k,n); if(raw==null) return;
      const v=raw*sc;
      const y=Y(v), y0=Y(Math.max(yd[0],0));
      const hgt=Math.abs(y0-y);
      // 4px rounded data-end anchored to the baseline; 2px gap between bars
      const r=Math.min(4*k,bw/2,hgt);
      const x=gx+si*(bw+2*k);
      const top=Math.min(y,y0);
      const d=`M${x} ${top+hgt} L${x} ${top+r} Q${x} ${top} ${x+r} ${top}
        L${x+bw-r} ${top} Q${x+bw} ${top} ${x+bw} ${top+r} L${x+bw} ${top+hgt} Z`;
      // A slope is only as good as the fit behind it -- for the panel this
      // applies to, dim + hatch a bar whose fit is thin or curved, so a
      // shaky number is never drawn identically to a solid one.
      let quality=null;
      if(spec.q){
        quality=stiffQuality(valOf(s,spec.q.n,n), valOf(s,spec.q.r2,n));
      }
      const thisBi=bi++;
      const path=el("path",{d, fill:s.colour, class:"bar-mark",
        style:`cursor:crosshair;--bi:${thisBi}` + (quality&&quality!=="ok" ? ";opacity:.55" : "")},root);
      if(quality&&quality!=="ok"){
        el("path",{d, fill:`url(#${ensureHatch(root)})`, class:"bar-mark",
          style:`pointer-events:none;--bi:${thisBi}`},root);
      }
      path.addEventListener("pointermove",ev=>showTip(ev,`${L(UI.cycleAxis)} ${n} · ${s.name}`,s.colour,
        [[L(spec.t), spec.f(v)+(spec.u2?" "+spec.u2:"")],
         [L(UI.peakStressTip), fmt(valOf(s,"peakStress",n),0)+" MPa"],
         ...(quality&&quality!=="ok" ? [[L(UI.fitQualityLbl), qualityLabel(quality)]] : [])]));
      // Direct labels stay SELECTIVE: past three series a number on every bar
      // is 40+ labels fighting for the same strip of space. Beyond that the
      // hover tooltip and the values table carry the exact figures.
      if(big && ser.length<=3){
        const lab=el("text",{x:x+bw/2,y:top-5,class:"vl","text-anchor":"middle"},root);
        lab.textContent=spec.f(v);
      }
    });
  }
  root.addEventListener("pointerleave",hideTip);
}

/* stress–displacement curves */
function loopChart(host, _spec, big=false, aspect=null){
  const ser=series().filter(s=>!s.isAvg);
  if(!ser.length){ host.innerHTML=""; return; }
  const W = 1000, H = aspect ? Math.round(W/aspect) : 400;
  const rows = legendRows(ser, 52, W-14, big);
  const legH = (big ? 26 : 20) + (rows-1)*(big?17:13);
  const m={l:52,r:14,t:12+legH,b:34};
  const root=svg(host,W,H);
  drawLegend(root, ser, 52, legH-(big?12:9), big, W-14);

  // Displacement axis in µm, not mm: the raw curve is stored in mm, so every
  // x-value is scaled by DISP_SCALE at the point it is read, both for the
  // domain (gmax, xd) and for each drawn point -- nowhere else in the page
  // reads c.pts, so this is the one place the unit changes.
  const DISP_SCALE = 1000;
  const all=ser.flatMap(s=>SPS[s.key].cycles.flatMap(c=>c.pts));
  if(!all.length) return;
  const gmax=Math.max(...all.map(p=>p[0]*DISP_SCALE));
  const xd=[-0.008*DISP_SCALE,gmax*1.03], yd=[0,Math.max(...all.map(p=>p[1]))*1.04];
  const X=v=>m.l+(v-xd[0])/(xd[1]-xd[0])*(W-m.l-m.r);
  const Y=axes(root,m,W,H,yd,v=>v.toFixed(0),L(UI.dispAxisUm));
  for(const t of ticks(xd[0],xd[1],big?7:5)){
    if(t<xd[0]||t>xd[1]) continue;
    const tx=el("text",{x:X(t),y:H-m.b+12,class:"tk","text-anchor":"middle"},root);
    tx.textContent=t.toFixed(0);
  }
  const yl=el("text",{x:0,y:0,class:"altl","text-anchor":"middle",
    transform:`translate(11 ${(m.t+H-m.b)/2}) rotate(-90)`},root);
  yl.textContent=L(UI.stressAxis);
  ser.forEach(s=>{
    SPS[s.key].cycles.forEach(c=>{
      if(!c.pts || !c.pts.length) return;
      const d=c.pts.map(p=>`${X(p[0]*DISP_SCALE).toFixed(1)} ${Y(p[1]).toFixed(1)}`).join(" L");
      el("path",{d:"M"+d,fill:"none",stroke:s.colour,"stroke-width":big?1.7:1.4,
        "stroke-linejoin":"round",opacity:.9,class:"loop-path"},root);
    });
  });
}

/* the panels, in the order they are read */
const PANELS=[
  {k:"peakStress", t:{en:"Peak stress",de:"Spitzenspannung"}, u:{en:"MPa",de:"MPa"}, f:v=>fmt(v,0), u2:"MPa",
   why:{en:"Highest stress reached in each cycle. It rises every stage by design (this is the "+
       "programmed schedule, not a material response), and it is the reference every "+
       "per-cycle-relative metric is measured against.",
   de:"Höchste in jedem Zyklus erreichte Spannung. Sie steigt planmäßig mit jeder Stufe (das "+
       "ist der programmierte Ablauf, keine Materialreaktion) und ist die Referenz, auf die "+
       "sich jede zyklusbezogene Kennzahl bezieht."}},
  {k:"kCommon", t:{en:"Common-band stiffness",de:"Steifigkeit, gemeinsames Fenster"},
   u:{en:"MPa/mm, identical window every cycle",de:"MPa/mm, identisches Fenster in jedem Zyklus"},
   f:v=>v>=1000?(v/1000).toFixed(1)+"k":fmt(v,0), u2:"MPa/mm",
   q:{n:"kCommonN", r2:"kCommonR2"},
   why:{en:"Slope of the loading branch fitted over an IDENTICAL stress window in every cycle -- "+
       "auto-located once, on the reference (smallest-peak) cycle's own most-linear region, "+
       "then reused as the same absolute-stress window on every other cycle. This is the "+
       "form that may be compared across stages, specimens and materials. A rollover here is "+
       "the material softening. A hatched, dimmed bar means the fit behind it is thin (fewer "+
       "than "+QUALITY_MIN_POINTS+" points) or curved (R² below "+QUALITY_MIN_R2+"): read "+
       "that cycle's slope as indicative only, never as a solid number to quote.",
   de:"Steigung des Belastungsastes über ein IDENTISCHES Spannungsfenster in jedem Zyklus -- "+
       "einmalig im linearsten Bereich des Referenzzyklus (kleinste Spitzenspannung) bestimmt "+
       "und danach als gleiches absolutes Fenster auf jeden anderen Zyklus angewendet. Diese "+
       "Form darf über Stufen, Proben und Materialien hinweg verglichen werden. Ein Abknicken "+
       "hier bedeutet, dass das Material weicher wird. Ein schraffierter, abgedunkelter Balken "+
       "bedeutet, dass die Anpassung dünn (weniger als "+QUALITY_MIN_POINTS+" Punkte) oder "+
       "gekrümmt (R² unter "+QUALITY_MIN_R2+") ist: die Steigung dieses Zyklus nur als "+
       "Anhaltswert lesen, nie als belastbare Zahl zitieren."}},
  {k:"kRel", t:{en:"Relative-band stiffness",de:"Steifigkeit, eigenes Fenster"},
   u:{en:"MPa/mm, window auto-located per cycle",de:"MPa/mm, Fenster je Zyklus automatisch bestimmt"},
   f:v=>v>=1000?(v/1000).toFixed(1)+"k":fmt(v,0), u2:"MPa/mm",
   q:{n:"kRelN", r2:"kRelR2"},
   why:{en:"Slope fitted over a window auto-located on THIS cycle's OWN loading branch -- the "+
       "region of maximum, most-linear slope, found from the data rather than a fixed "+
       "percentage (ASTM E111 toe compensation / chord modulus). Describes each cycle "+
       "faithfully and typically fits tighter than the common band, but is NOT comparable "+
       "across cycles of a multi-stage test, since the window itself moves with each cycle's "+

/* controls */
function renderCtrls(){
  const chips = SPS.map((s,i)=>{
    const on = !state.hidden.has(i);
    return `<button class="chip" role="switch" aria-pressed="${on}" data-sp="${i}"
      title="${s.label||s.short}">
      <span class="sw" style="background:${colourOf(i)}"></span>${s.short}</button>`;
  }).join("");
  const avgChip = SPS.length>1
    ? `<button class="chip" role="switch" aria-pressed="${state.avg}" data-avg="1"
        title="${L(UI.avgTitle)}">
        <span class="sw" style="background:var(--avg)"></span>${L(UI.avg)}</button>` : "";
  const nVis = visible().length;
  const allOn = nVis===SPS.length;
  const bulk = SPS.length>2
    ? `<button class="linkish" data-bulk="${allOn?"none":"all"}">${allOn?L(UI.hideAll):L(UI.showAll)}</button>`
    : "";
  $("#ctrls").innerHTML =
    `<div class="grp"><span class="lbl">${L(UI.specimensLbl)}</span>${chips}${avgChip}${bulk}</div>` +
    (state.avg && nVis>1
      ? `<span class="barnote">${L({en:`Avg is the mean of the ${nVis} specimens shown, per cycle`,
          de:`„Mittel“ ist der Durchschnitt der ${nVis} angezeigten Proben, je Zyklus`})}</span>`
      : "");
  $("#ctrls").querySelectorAll("[data-sp]").forEach(b=>b.onclick=()=>{
    const i=+b.dataset.sp;
    state.hidden.has(i) ? state.hidden.delete(i) : state.hidden.add(i);
    renderAll();
  });
  const av=$("#ctrls").querySelector("[data-avg]");
  if(av) av.onclick=()=>{ state.avg=!state.avg; renderAll(); };
  const bk=$("#ctrls").querySelector("[data-bulk]");
  if(bk) bk.onclick=()=>{
    if(bk.dataset.bulk==="all") state.hidden.clear();
    else SPS.forEach((_,i)=>state.hidden.add(i));
    renderAll();
  };
}

/* export: SVG → PNG.
   The chart SVG paints itself from CSS custom properties and classes, none of
   which survive being lifted out of the document. So the clone gets every
   paint property resolved to a literal value first -- otherwise the export
   comes out black-on-transparent. */
const PAINT=["fill","stroke","stroke-width","stroke-linejoin","stroke-linecap",
  "opacity","fill-opacity","stroke-opacity","font-size","font-family","font-weight",
  "text-anchor","letter-spacing"];
function freezePaint(src,dst){
  const cs=getComputedStyle(src);
  let css="";
  for(const p of PAINT){const v=cs.getPropertyValue(p); if(v) css+=`${p}:${v};`;}
  dst.setAttribute("style",css);
  dst.removeAttribute("class");
  const a=src.children,b=dst.children;
  for(let i=0;i<a.length;i++) freezePaint(a[i],b[i]);
}
async function chartToPng(svgEl,title,sub,scale=2.5){
  const vb=svgEl.getAttribute("viewBox").split(/\s+/).map(Number);
  const w=vb[2],h=vb[3],pad=14,head=title?42:0;
  // Freeze animations first: a chart exported mid-reveal would otherwise bake
  // in a part-grown bar, since the reveal is a transform and an opacity.
  svgEl.classList.add("exporting");
  void svgEl.getBoundingClientRect();
  const clone=svgEl.cloneNode(true);
  freezePaint(svgEl,clone);
  svgEl.classList.remove("exporting");
  clone.classList.remove("exporting");
  if(head){
    const g=document.createElementNS(NS,"g");
    while(clone.firstChild) g.appendChild(clone.firstChild);
    g.setAttribute("transform",`translate(0 ${head})`);
    clone.appendChild(g);
    const bodyCs=getComputedStyle(document.body);
    const ink=bodyCs.color, fam=bodyCs.fontFamily;
    const t=el("text",{x:0,y:16,
      style:`fill:${ink};font-size:16px;font-weight:660;font-family:${fam}`},clone);
    t.textContent=title;
    if(sub){
      const st=el("text",{x:0,y:33,
        style:`fill:${ink};opacity:.62;font-size:11.5px;font-family:${fam}`},clone);
      st.textContent=sub;
    }
  }
  const W=w+pad*2, H=h+head+pad*2;
  clone.setAttribute("xmlns",NS);
  clone.setAttribute("width",W); clone.setAttribute("height",H);
  clone.setAttribute("viewBox",`${-pad} ${-pad} ${W} ${H}`);
  const bg=getComputedStyle(document.body).backgroundColor;
  let str=new XMLSerializer().serializeToString(clone);
  str=str.replace(/(<svg[^>]*>)/,
    `$1<rect x="${-pad}" y="${-pad}" width="${W}" height="${H}" fill="${bg}"/>`);
  const img=new Image();
  img.src="data:image/svg+xml;charset=utf-8,"+encodeURIComponent(str);
  await new Promise((ok,no)=>{img.onload=ok;img.onerror=()=>no(new Error("render failed"));});
  const c=document.createElement("canvas");
  c.width=Math.round(W*scale); c.height=Math.round(H*scale);
  c.getContext("2d").drawImage(img,0,0,c.width,c.height);
  return new Promise(r=>c.toBlob(r,"image/png"));
}
const slug=t=>t.replace(/[^\w]+/g,"-").replace(/^-|-$/g,"").toLowerCase();

/* A sandboxed iframe without allow-same-origin (the Claude Artifact preview)
   forces an opaque origin, and window.origin then reads the literal string
   "null" -- exactly the case where a script-started download is silently
   dropped. window.origin ONLY: a srcdoc document's location.origin reads
   "null" as a browser quirk regardless of sandboxing (Streamlit's
   components.html iframe grants allow-same-origin and allow-downloads and
   still shows it), so location.origin is not part of this check. */
const SANDBOXED = (()=>{ try{ return window.origin==="null"; } catch(e){ return false; } })();

const imgDlg=$("#img-dlg");
function showImageFallback(blob,title,hint){
  const url=URL.createObjectURL(blob);
  const im=$("#img-out");
  im.onload=()=>setTimeout(()=>URL.revokeObjectURL(url),1000);
  im.src=url;
  $("#img-t").textContent=title;
  $("#img-hint").innerHTML=hint;
  if(!imgDlg.open) imgDlg.showModal();
}
$("#img-close").innerHTML=ICONS.close;
$("#img-close").onclick=()=>imgDlg.close();
imgDlg.addEventListener("click",ev=>{ if(ev.target===imgDlg) imgDlg.close(); });

async function copyChart(svgEl,title,sub){
  let blob;
  try{ blob=await chartToPng(svgEl,title,sub); }
  catch(e){ toast(L(UI.toastNoRender)); return; }
  try{
    await navigator.clipboard.write([new ClipboardItem({"image/png":blob})]);
    toast(L(UI.toastCopied));
  }catch(e){
    showImageFallback(blob,title,L(UI.clipboardHint));
  }
}
async function downloadChart(svgEl,title,sub){
  let blob;
  try{ blob=await chartToPng(svgEl,title,sub); }
  catch(e){ toast(L(UI.toastNoRender)); return; }
  if(SANDBOXED){
    showImageFallback(blob,title,L(UI.downloadHint));
    return;
  }
  const url=URL.createObjectURL(blob);
  const a=document.createElement("a");
  a.href=url; a.download=`${slug(DATA.sourceFilename||"chart")}_${slug(title)}.png`;
  document.body.appendChild(a); a.click(); a.remove();
  setTimeout(()=>URL.revokeObjectURL(url),4000);
  toast(L(UI.toastPngDownloaded));
}

/* expand */
const dlg=$("#dlg");
let openIndex=null;
function drawExpanded(){
  if(openIndex==null) return;
  const p=PANELS[openIndex], box=$("#dlg-plot");
  // Measured after the dialog is on screen, so the chart is built to the space
  // that actually exists on this display rather than a guessed one.
  const w=box.clientWidth, h=box.clientHeight;
  (p.draw||barChart)(box,p,true, w>0&&h>0 ? w/h : null);
}
function expand(i){
  const p=PANELS[i];
  openIndex=i;
  $("#dlg-t").textContent=L(p.t);
  $("#dlg-u").textContent=L(p.u);
  $("#dlg-why").textContent=L(p.why)||"";
  $("#dlg-acts").innerHTML =
    actBtn("copy",L(UI.copyPng))+actBtn("png",L(UI.downloadPng))+actBtn("close",L(UI.closeLbl));
  if(!dlg.open) dlg.showModal();
  drawExpanded();
}
$("#dlg-acts").addEventListener("click",async ev=>{
  const b=ev.target.closest("[data-act]"); if(!b) return;
  const s=$("#dlg-plot").querySelector("svg"), p=PANELS[openIndex];
  if(b.dataset.act==="copy") await copyChart(s,L(p.t),L(p.u));
  else if(b.dataset.act==="png") await downloadChart(s,L(p.t),L(p.u));
  else dlg.close();
});

  rsz=setTimeout(()=>{ if(dlg.open) drawExpanded(); },120); });

$("#charts").addEventListener("click",async ev=>{
  const b=ev.target.closest("[data-act]");
  const cell=ev.target.closest(".cell"); if(!cell) return;
  const i=+cell.dataset.i, p=PANELS[i];
  if(b){
    // Scoped to .plot: .cell also holds toolbar-icon <svg>s in .hd, rendered
    // before the chart, so an unscoped query grabs an icon instead of it.
    const s=cell.querySelector(".plot svg");
    if(!s){ toast(L(UI.toastNothingToExport)); return; }
    if(b.dataset.act==="copy") await copyChart(s,L(p.t),L(p.u));
    else if(b.dataset.act==="png") await downloadChart(s,L(p.t),L(p.u));
    else expand(i);
    return;
  }
  if(ev.target.closest(".plot")) expand(i);
});
$("#charts").addEventListener("keydown",ev=>{
  if(ev.key!=="Enter"&&ev.key!==" ") return;
  const plot=ev.target.closest(".plot"); if(!plot) return;
  ev.preventDefault(); expand(+plot.closest(".cell").dataset.i);
});

function renderTable(){
  const shown = visible();
  let body="";
  shown.forEach((idx,si)=>{
    const s=SPS[idx];
    s.cycles.forEach((c,ci)=>{
      body += `<tr${ci===0&&si>0?' class="sep"':''}>` +
        COLS.map(([,f,d])=>`<td>${d==="html"?f(c,s,idx):fmt(f(c,s,idx),d)}</td>`).join("") +
        "</tr>";
    });
  });
  $("#tbl").innerHTML =
    `<thead><tr>${COLS.map(([h])=>`<th>${L(h)}</th>`).join("")}</tr></thead><tbody>${body}</tbody>`;
}

/* method tab: every word below is static text from the Python source */
const DEFS=[
  [{en:"Peak stress",de:"Spitzenspannung"},"MPa",
   {en:"Highest stress reached in this cycle. Rises every stage in a multi-stage test, which is why several metrics exist in both a per-cycle and a common-reference form.",
    de:"Höchste in diesem Zyklus erreichte Spannung. Steigt in jeder Stufe einer mehrstufigen Prüfung, weshalb es mehrere Kennzahlen sowohl je Zyklus als auch als gemeinsame Referenzform gibt."}],
  [{en:"Stiffness, common band",de:"Steifigkeit, gemeinsames Fenster"},"MPa/mm",
   {en:"Slope of the loading branch fitted over an IDENTICAL stress window in every cycle (25-75% of the smallest cycle peak). This is the form that may be compared across stages, specimens and materials.",
    de:"Steigung des Belastungsastes über ein IDENTISCHES Spannungsfenster in jedem Zyklus (25-75% der kleinsten Zyklusspitze). Diese Form darf über Stufen, Proben und Materialien hinweg verglichen werden."}],
  [{en:"Stiffness, relative band",de:"Steifigkeit, eigenes Fenster"},"MPa/mm",
   {en:"Slope over a window auto-located on THIS cycle's own loading branch (ASTM E111 toe compensation / chord modulus). Describes the cycle faithfully but is NOT comparable across cycles, since the window itself moves with each cycle's own peak.",
    de:"Steigung über ein Fenster, automatisch im Belastungsast DIESES Zyklus bestimmt (ASTM E111 Toe-Kompensation / Sehnenmodul). Beschreibt den Zyklus originalgetreu, ist aber NICHT über Zyklen vergleichbar, da sich das Fenster mit der jeweiligen Spitze verschiebt."}],
  [{en:"Maximum displacement",de:"Maximaler Weg"},"mm",
   {en:"Largest displacement reached in the cycle, and the point the energy integrals split the loop at. Exceeds the displacement at peak stress by however much the specimen crept while the load was held.",
    de:"Größter in diesem Zyklus erreichter Weg, und der Punkt, an dem die Energieintegrale die Schleife teilen. Übersteigt den Weg bei Spitzenspannung um so viel, wie die Probe während des Haltens weiterkroch."}],
  [{en:"Stress at maximum displacement",de:"Spannung bei maximalem Weg"},"MPa",
   {en:"Stress at the instant the specimen was most compressed. On an intact specimen this equals the peak. When it falls below, the specimen went on compacting while the load was being REMOVED: a damage signature no other column carries.",
    de:"Spannung im Moment der stärksten Verdichtung der Probe. Bei einer intakten Probe entspricht dies der Spitze. Fällt sie darunter, hat die Probe sich weiter verdichtet, während die Last bereits ABGEBAUT wurde: ein Schädigungsmerkmal, das keine andere Spalte zeigt."}],
  [{en:"Permanent deformation, this cycle",de:"Bleibende Verformung, dieser Zyklus"},"mm / %",
   {en:"How much permanent set THIS cycle alone added, read within itself: residual displacement on the loading branch versus the unloading branch, at the same low reference stress, with no other cycle involved. Not read at zero stress: at zero the specimen loses contact and the signal falls back to a few-micrometre baseline. Well-defined at every cycle count, including a single-cycle test. The view that shows a sudden jump -- a step change here is the first sign of new damage starting in that specific cycle. NOT compression set in the ASTM D395 / ISO 815 sense.",
    de:"Wie viel bleibende Verformung DIESER Zyklus allein hinzugefügt hat, für sich betrachtet: Restweg auf dem Belastungsast gegenüber dem Entlastungsast, bei derselben niedrigen Referenzspannung, ohne Bezug zu einem anderen Zyklus. Nicht bei Nullspannung gemessen: dort verliert die Probe den Kontakt und das Signal fällt auf eine wenige Mikrometer große Grundlinie zurück. Bei jeder Zyklenzahl wohldefiniert, auch bei einer Einzelzyklus-Prüfung. Die Ansicht, die einen plötzlichen Sprung zeigt -- ein Stufenwechsel hier ist das erste Anzeichen einer neuen Schädigung in genau diesem Zyklus. KEIN Druckverformungsrest im Sinne von ASTM D395 / ISO 815."}],
  [{en:"Permanent deformation, running total",de:"Bleibende Verformung, Summe"},"mm / %",
   {en:"The per-cycle amounts above, added up cycle by cycle: how much of the specimen's thickness has not sprung back by this point in the test, altogether. Always rises or holds flat, never falls. A single unusually large cycle can be hard to spot here since it only steepens one step among a run of already-rising bars -- check the per-cycle figure to see which cycle actually did the damage.",
    de:"Die obigen Werte je Zyklus, Zyklus für Zyklus aufsummiert: wie viel von der Probendicke bis zu diesem Punkt insgesamt nicht zurückgefedert ist. Steigt immer oder bleibt gleich, fällt nie. Ein einzelner ungewöhnlich großer Zyklus ist hier schwer zu erkennen, da er nur eine Stufe unter bereits ansteigenden Balken etwas steiler macht -- der Wert je Zyklus zeigt, welcher Zyklus die eigentliche Schädigung verursacht hat."}],
  [{en:"Energy in / dissipated",de:"Energie ein / dissipiert"},"MPa·mm",
   {en:"Work per unit CROSS-SECTIONAL AREA: the integral of stress over displacement is work/area, not work/volume. Divide by h₀ for work per unit volume in MPa. The loop is split at maximum displacement, not maximum stress.",
    de:"Arbeit je QUERSCHNITTSFLÄCHE: das Integral der Spannung über den Weg ist Arbeit/Fläche, nicht Arbeit/Volumen. Durch h₀ teilen für Arbeit je Volumen in MPa. Die Schleife wird beim maximalen Weg geteilt, nicht bei der maximalen Spannung."}],
  [{en:"Hysteresis loss",de:"Hystereseverlust"},"-",
   {en:"Dissipated divided by input energy. The cross-test comparable form: absolute loss scales with stress amplitude, so a 50 MPa and a 450 MPa stage cannot be compared on the absolute number.",
    de:"Dissipierte geteilt durch eingebrachte Energie. Die über Prüfungen vergleichbare Form: der absolute Verlust skaliert mit der Spannungsamplitude, eine 50-MPa- und eine 450-MPa-Stufe sind daher anhand der absoluten Zahl nicht vergleichbar."}],
  [{en:"Hold length",de:"Haltedauer"},"samples",
   {en:"Length of the detected dwell in SAMPLES, not seconds: the export carries no time channel. Meaningless on its own and mandatory alongside the hold displacement beside it.",
    de:"Länge der erkannten Verweilzeit in MESSPUNKTEN, nicht Sekunden: der Export enthält keinen Zeitkanal. Allein aussagelos und nur zusammen mit dem daneben stehenden Haltewegzuwachs sinnvoll."}],
  [{en:"Hold displacement",de:"Haltewegzuwachs"},"mm",

    de:"Über die Verweilzeit aufsummierter Weg: eine GESAMTSUMME, keine Rate. Nur zwischen Zyklen mit gleicher Haltedauer vergleichbar, weshalb die Haltedauer stets daneben angegeben wird."}],
  [{en:"Hold displacement / 1000 samples",de:"Haltewegzuwachs / 1000 Messpunkte"},"µm",
   {en:"Removes the distortion of unequal dwell lengths so cycles can be ranked. NOT a creep rate: converting samples to time needs a constant sampling interval, which the export does not record.",
    de:"Entfernt die Verzerrung durch unterschiedliche Haltedauern, damit Zyklen eingeordnet werden können. KEINE Kriechrate: die Umrechnung von Messpunkten in Zeit erfordert ein konstantes Abtastintervall, das der Export nicht aufzeichnet."}],

       "threshold -- the two segmentation rows below are SAFETY FLOORS on that, not the primary "+

    de:"Zyklusgrenzen werden durch lokal-adaptive Peak-Erkennung gefunden, nicht durch einen "+

/* tabs */
document.querySelectorAll('[role="tab"]').forEach(t=>{
  t.onclick=()=>{
    document.querySelectorAll('[role="tab"]').forEach(o=>{
      const on = o===t;
      o.setAttribute("aria-selected",on);
      const panel=$("#"+o.getAttribute("aria-controls"));
      panel.hidden=!on;
      if(on){ panel.style.animation="none"; void panel.offsetWidth; panel.style.animation=""; }
    });
  };
});

function renderHead(){
  const s=SPS[0];
  $("#title").textContent = (DATA.sourceFilename||L(UI.defaultTitle)).replace(/\.xlsx$/i,"");
  if(!s){ $("#meta").innerHTML=""; return; }
  const meta=[[L(UI.specimensLbl),SPS.length],[L(UI.cyclesLbl),NC],
    [L(UI.peakLbl),fmt(s.globalPeak,1)+" MPa"],["h₀",fmt(s.h0)+" mm"],["d₀",fmt(s.d0)+" mm"],
    [L(UI.channelLbl),s.channel||"-"],["T",fmt(s.temp)+" °C"]];
  $("#meta").innerHTML=meta.map(([k,v])=>`<span class="mchip"><b>${k}</b>${v}</span>`).join("");
  $("#dlnote").textContent = L(UI.exportNote);
  $("#foot").textContent = L(UI.footerNote);
}

function renderWarnings(){
  const el = $("#warnbar");
  const warnings = DATA.warnings || [];
  if(!warnings.length){ el.innerHTML=""; return; }
  const ORDER = ["critical","caution","info"];
  const PILL = {critical:L(UI.critical), caution:L(UI.caution), info:L(UI.info)};
  const bySev = {critical:[], caution:[], info:[]};
  warnings.forEach(w => {
    const sev = ORDER.includes(w.severity) ? w.severity : "info";
    bySev[sev].push(w);
  });

  const chips = ORDER.filter(sev => bySev[sev].length).map(sev =>
    `<button type="button" class="warnchip ${sev}" aria-expanded="false" aria-controls="warnpanel">`+
      `<span>${PILL[sev]}</span><span class="n">${bySev[sev].length}</span>`+
      `<svg class="chev" viewBox="0 0 10 10" aria-hidden="true">`+
        `<path d="M2 3.5 L5 6.5 L8 3.5" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"/>`+
      `</svg>`+
    `</button>`
  ).join("");
  const cards = ORDER.flatMap(sev => bySev[sev].map(w =>
    `<div class="warncard ${sev}"><span class="pill">${PILL[sev]}</span><span>${w.message}</span></div>`
  )).join("");

  el.innerHTML =
    `<div class="warnchips">${chips}</div>`+
    `<div class="warnpanel" id="warnpanel" hidden>${cards}</div>`;

  const panel = $("#warnpanel");
  el.querySelectorAll(".warnchip").forEach(btn => {
    btn.addEventListener("click", () => {
      const willOpen = panel.hasAttribute("hidden");
      panel.toggleAttribute("hidden", !willOpen);
      el.querySelectorAll(".warnchip").forEach(b => b.setAttribute("aria-expanded", String(willOpen)));
    });
  });
}

function renderAll(){
  renderCtrls(); renderCharts(); renderTable();
  if(openIndex!=null) drawExpanded();
}
renderTheme(); renderLangToggle(); applyStaticLang();
renderHead(); renderWarnings(); renderAll(); renderMethod();
</script>
