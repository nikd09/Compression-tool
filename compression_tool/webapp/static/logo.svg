<svg xmlns="http://www.w3.org/2000/svg" width="220" height="40" viewBox="0 0 220 40">
  <defs>
    <linearGradient id="ctIconGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#4a93ea"/>
      <stop offset="100%" stop-color="#2a78d6"/>
    </linearGradient>
    <style>
      /* The same load-hold-unload press motion as the Ingest/Commit
         loading overlay (webapp/common.py's utm_press_html), just tiny and
         always-on -- the icon itself is a miniature of that animation's
         rig, so reusing its exact motion (not inventing a second one) is
         what makes the two read as the same mark at two sizes, not two
         different animations that happen to share a subject.
         CSS keyframes declared inside an SVG's own style block still
         animate when the SVG is used as an image source (confirmed live)
         -- st.logo renders it that way, and an external stylesheet could
         not reach inside the image to animate it, only an internal one
         can. Literal angle brackets are avoided even in this comment: an
         SVG loaded as a data URI is parsed as strict XML, and a raw
         "less-than sign, tag name" sequence anywhere in the text --
         including inside a CSS comment -- opens a real (unmatched)
         element as far as that parser is concerned. */
      @keyframes ctLogoPress {
        0%, 100% { transform: translateY(0); }
        40% { transform: translateY(2.4px); }
        55% { transform: translateY(2.6px); }
        70% { transform: translateY(2.4px); }
      }
      @keyframes ctLogoSquash {
        0%, 100% { transform: scaleY(1); }
        40% { transform: scaleY(.8); }
        55% { transform: scaleY(.76); }
        70% { transform: scaleY(.8); }
      }
      @keyframes ctLogoGlow {
        0%, 100% { opacity: .16; }
        55% { opacity: .55; }
      }
      .ct-logo-head { animation: ctLogoPress 2.6s cubic-bezier(.45,0,.45,1) infinite;
        transform-box: fill-box; transform-origin: 50% 0%; }
      .ct-logo-specimen { animation: ctLogoSquash 2.6s cubic-bezier(.45,0,.45,1) infinite;
        transform-box: fill-box; transform-origin: 50% 100%; }
      .ct-logo-glow { animation: ctLogoGlow 2.6s cubic-bezier(.45,0,.45,1) infinite; }
      @media (prefers-reduced-motion: reduce) {
        .ct-logo-head, .ct-logo-specimen, .ct-logo-glow { animation: none; }
      }
      .ct-logo-ink { fill: #14140f; }
      @media (prefers-color-scheme: dark) {
        .ct-logo-ink { fill: #f4f2f1; }
      }
    </style>
  </defs>
  <rect x="0" y="4" width="32" height="32" rx="9" fill="url(#ctIconGrad)"/>
  <ellipse class="ct-logo-glow" cx="16" cy="27.5" rx="8" ry="2.4" fill="#ffffff"/>
  <rect class="ct-logo-head" x="7" y="11.5" width="18" height="3.4" rx="1.5" fill="#ffffff"/>
  <ellipse class="ct-logo-specimen" cx="16" cy="20.5" rx="6" ry="3.4" fill="#ffffff"/>
  <rect x="7" y="24.5" width="18" height="3.4" rx="1.5" fill="#ffffff"/>
  <text x="42" y="26" font-family="system-ui,-apple-system,'Segoe UI',Roboto,sans-serif"
        font-size="17" font-weight="800" letter-spacing="-0.4" class="ct-logo-ink">Compress<tspan fill="#2a78d6">Lab</tspan></text>
</svg>
