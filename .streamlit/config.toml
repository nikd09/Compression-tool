# Streamlit chrome, themed to match the results dashboard the Results view
# embeds. Both palettes are the same surfaces and inks the dashboard template
# declares, so the app around the charts does not look like a different tool.
#
# chartCategoricalColors is the validated categorical palette in its fixed slot
# order -- the Compare view's charts therefore use the same hues, in the same
# order, as the dashboard's specimen series.

[theme]
base = "light"
primaryColor = "#2a78d6"
backgroundColor = "#f9f9f7"
secondaryBackgroundColor = "#f2f1ed"
textColor = "#0b0b0b"
linkColor = "#2a78d6"
borderColor = "#e1e0d9"
showWidgetBorder = true
baseRadius = "0.55rem"
buttonRadius = "0.4rem"
font = "system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif"
codeFont = "ui-monospace, SFMono-Regular, Menlo, Consolas, monospace"
chartCategoricalColors = [
  "#2a78d6", "#eb6834", "#1baf7a", "#eda100",
  "#e87ba4", "#008300", "#4a3aa7", "#e34948",
]

[theme.sidebar]
backgroundColor = "#f2f1ed"
secondaryBackgroundColor = "#f9f9f7"
borderColor = "#e1e0d9"

# Dark is selected, not an automatic flip: these are the dark steps of the same
# hues, chosen for the dark surface and validated against it.
[theme.dark]
backgroundColor = "#0d0d0d"
secondaryBackgroundColor = "#1a1a19"
textColor = "#ffffff"
primaryColor = "#3987e5"
linkColor = "#3987e5"
borderColor = "#2c2c2a"
chartCategoricalColors = [
  "#3987e5", "#d95926", "#199e70", "#c98500",
  "#d55181", "#008300", "#9085e9", "#e66767",
]

[theme.dark.sidebar]
backgroundColor = "#1a1a19"
secondaryBackgroundColor = "#232322"
borderColor = "#2c2c2a"

[server]
# The uploader has to take a full multi-specimen export; the 200 MB default is
# already generous but is stated here so it is not a surprise if it changes.
maxUploadSize = 200

[browser]
gatherUsageStats = false

[client]
# "viewer" drops Deploy, Rerun, Clear cache, Settings and About from the
# top-right menu -- all of them either Streamlit-Cloud-specific (Deploy,
# irrelevant and possibly confusing on a machine this app is just launched
# on) or developer-facing (Rerun, Clear cache -- this app has no
# @st.cache_data/@st.cache_resource anywhere, so Clear cache has nothing to
# do here; Settings/About are about Streamlit itself, not this tool).
# Print and Record screen are NOT developer options in Streamlit's own
# classification, so "viewer" cannot drop them individually -- they stay,
# and they're harmless.
toolbarMode = "viewer"
