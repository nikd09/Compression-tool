name: CI

# No `main`/`master` branch exists in this repository yet (everything so
# far lives on feature branches) -- triggering on every push and every
# pull request, rather than naming a specific branch, is what makes this
# actually run regardless of what this repo's branch convention ends up
# being once one is established.
on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # The floor and a recent release -- pyproject.toml declares
        # requires-python = ">=3.10"; this is not an exhaustive matrix,
        # just enough to catch a version-specific regression without
        # tripling CI time for a small internal tool.
        python-version: ["3.10", "3.12"]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install (core + webapp + dev)
        run: python -m pip install -e ".[webapp,dev]"

      - name: pyflakes
        run: python -m pyflakes compression_tool tests

      - name: pytest
        run: python -m pytest -q
